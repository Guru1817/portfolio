<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="vbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2620"/>
      <stop offset="100%" stop-color="#0a0c1c"/>
    </linearGradient>
    <linearGradient id="vemerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="vviolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="vglow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#vbg)"/>
  <ellipse cx="400" cy="270" rx="360" ry="240" fill="url(#vglow)"/>

  <!-- Multi-tenant: stacked branded portal cards -->
  <g>
    <!-- back card (violet tenant) -->
    <rect x="250" y="120" width="300" height="190" rx="24" fill="#141033" stroke="rgba(139,92,246,0.35)" stroke-width="2" transform="rotate(-6 400 215)"/>
    <!-- middle card (emerald tenant) -->
    <rect x="250" y="120" width="300" height="190" rx="24" fill="#0b241d" stroke="rgba(16,185,129,0.35)" stroke-width="2" transform="rotate(6 400 215)"/>
    <!-- front card (active portal) -->
    <rect x="250" y="120" width="300" height="190" rx="24" fill="#0a0617" stroke="rgba(255,255,255,0.14)" stroke-width="2"/>

    <!-- front card header: logo dot + brand line -->
    <circle cx="290" cy="158" r="14" fill="url(#vemerald)"/>
    <rect x="316" y="151" width="120" height="8" rx="4" fill="rgba(255,255,255,0.7)"/>
    <rect x="316" y="167" width="70" height="6" rx="3" fill="rgba(255,255,255,0.3)"/>

    <!-- MCQ question rows with checkmarks -->
    <g>
      <rect x="290" y="196" width="220" height="14" rx="7" fill="rgba(255,255,255,0.10)"/>
      <circle cx="299" cy="203" r="6" fill="url(#vemerald)"/>
      <rect x="290" y="222" width="220" height="14" rx="7" fill="rgba(255,255,255,0.10)"/>
      <circle cx="299" cy="229" r="6" fill="rgba(255,255,255,0.2)"/>
      <rect x="290" y="248" width="220" height="14" rx="7" fill="rgba(255,255,255,0.10)"/>
      <circle cx="299" cy="255" r="6" fill="url(#vviolet)"/>
    </g>

    <!-- timer pill -->
    <rect x="290" y="274" width="86" height="20" rx="10" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.4)"/>
    <circle cx="303" cy="284" r="5" fill="none" stroke="#10b981" stroke-width="2"/>
    <line x1="303" y1="284" x2="303" y2="281" stroke="#10b981" stroke-width="2"/>
    <rect x="316" y="280" width="48" height="8" rx="4" fill="rgba(16,185,129,0.7)"/>

    <!-- score / rank badge -->
    <rect x="424" y="274" width="86" height="20" rx="10" fill="rgba(139,92,246,0.15)" stroke="rgba(139,92,246,0.4)"/>
    <rect x="438" y="280" width="60" height="8" rx="4" fill="rgba(139,92,246,0.8)"/>
  </g>

  <!-- leaderboard bars floating right -->
  <g opacity="0.9">
    <rect x="600" y="360" width="18" height="50" rx="6" fill="url(#vviolet)"/>
    <rect x="624" y="340" width="18" height="70" rx="6" fill="url(#vemerald)"/>
    <rect x="648" y="376" width="18" height="34" rx="6" fill="rgba(255,255,255,0.25)"/>
  </g>

  <!-- Brand name -->
  <text x="400" y="418" text-anchor="middle"
        font-family="Clash Display, Inter, sans-serif"
        font-size="48" font-weight="600" fill="#f7f7ff">Vidyapeeth</text>
  <text x="400" y="456" text-anchor="middle"
        font-family="JetBrains Mono, monospace"
        font-size="13" letter-spacing="5" fill="#10b981">ONE PLATFORM · UNLIMITED PORTALS</text>

  <!-- URL -->
  <text x="400" y="522" text-anchor="middle"
        font-family="JetBrains Mono, monospace"
        font-size="14" fill="rgba(255,255,255,0.5)">vidyapeeth.in</text>
</svg>
