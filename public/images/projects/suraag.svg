<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="sbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1330"/>
      <stop offset="100%" stop-color="#05060f"/>
    </linearGradient>
    <linearGradient id="samber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="spink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <radialGradient id="sglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sbg)"/>
  <ellipse cx="400" cy="280" rx="360" ry="240" fill="url(#sglow)"/>

  <!-- Suraag waveform icon, large -->
  <g transform="translate(280 130)">
    <rect width="240" height="240" rx="56" fill="#0a0617" stroke="rgba(251,191,36,0.25)" stroke-width="2"/>
    <rect x="58"  y="92"  width="18" height="56"  rx="9" fill="url(#spink)"/>
    <rect x="92"  y="56"  width="18" height="128" rx="9" fill="url(#samber)"/>
    <circle cx="120" cy="120" r="8" fill="#fbbf24"/>
    <rect x="130" y="56"  width="18" height="128" rx="9" fill="url(#samber)"/>
    <rect x="164" y="92"  width="18" height="56"  rx="9" fill="url(#spink)"/>
  </g>

  <!-- Tagline -->
  <text x="400" y="430" text-anchor="middle"
        font-family="Clash Display, Inter, sans-serif"
        font-size="48" font-weight="600" fill="#f7f7ff">Suraag</text>
  <text x="400" y="468" text-anchor="middle"
        font-family="JetBrains Mono, monospace"
        font-size="14" letter-spacing="6" fill="#fbbf24">MUSIC THAT NEVER LOSES YOU</text>

  <!-- URL -->
  <text x="400" y="530" text-anchor="middle"
        font-family="JetBrains Mono, monospace"
        font-size="14" fill="rgba(255,255,255,0.5)">suraagmusic.in</text>
</svg>
