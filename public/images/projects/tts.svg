<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="tbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1a08"/>
      <stop offset="100%" stop-color="#0a0c1c"/>
    </linearGradient>
    <linearGradient id="tbar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="tbar2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <radialGradient id="tglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#tbg)"/>
  <ellipse cx="400" cy="320" rx="340" ry="240" fill="url(#tglow)"/>

  <!-- Speech bubble -->
  <g transform="translate(160 120)">
    <rect width="280" height="180" rx="32" fill="rgba(255,255,255,0.04)" stroke="rgba(245,158,11,0.4)" stroke-width="2"/>
    <path d="M 60 180 L 80 180 L 70 210 Z" fill="rgba(255,255,255,0.04)" stroke="rgba(245,158,11,0.4)" stroke-width="2"/>
    <!-- mock text lines -->
    <rect x="28" y="40" width="160" height="12" rx="6" fill="rgba(245,158,11,0.6)"/>
    <rect x="28" y="68" width="220" height="12" rx="6" fill="rgba(255,255,255,0.18)"/>
    <rect x="28" y="96" width="180" height="12" rx="6" fill="rgba(255,255,255,0.18)"/>
    <rect x="28" y="124" width="120" height="12" rx="6" fill="rgba(34,211,238,0.6)"/>
  </g>

  <!-- Arrow indicating conversion -->
  <g transform="translate(470 200)" stroke="#fbbf24" stroke-width="3" fill="none">
    <path d="M 0 20 L 60 20" stroke-linecap="round"/>
    <path d="M 50 10 L 60 20 L 50 30" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Sound waveform output -->
  <g transform="translate(540 140)">
    <rect x="0"   y="100" width="14" height="40"  rx="7" fill="url(#tbar)"/>
    <rect x="24"  y="60"  width="14" height="120" rx="7" fill="url(#tbar)"/>
    <rect x="48"  y="20"  width="14" height="200" rx="7" fill="url(#tbar2)"/>
    <rect x="72"  y="50"  width="14" height="140" rx="7" fill="url(#tbar)"/>
    <rect x="96"  y="80"  width="14" height="80"  rx="7" fill="url(#tbar2)"/>
    <rect x="120" y="40"  width="14" height="160" rx="7" fill="url(#tbar)"/>
    <rect x="144" y="90"  width="14" height="60"  rx="7" fill="url(#tbar2)"/>
    <rect x="168" y="60"  width="14" height="120" rx="7" fill="url(#tbar)"/>
    <rect x="192" y="100" width="14" height="40"  rx="7" fill="url(#tbar2)"/>
  </g>

  <!-- Bottom mock excel rows -->
  <g transform="translate(160 400)" opacity="0.85">
    <rect width="480" height="32" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(34,211,238,0.3)"/>
    <rect y="40" width="480" height="32" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(245,158,11,0.3)"/>
    <rect y="80" width="480" height="32" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(34,211,238,0.3)"/>
    <text x="20" y="22" font-family="JetBrains Mono, monospace" font-size="14" fill="#22d3ee">car.start</text>
    <text x="200" y="22" font-family="JetBrains Mono, monospace" font-size="14" fill="rgba(255,255,255,0.6)">→ "Starting the car"</text>
    <text x="20" y="62" font-family="JetBrains Mono, monospace" font-size="14" fill="#fbbf24">home.lights</text>
    <text x="200" y="62" font-family="JetBrains Mono, monospace" font-size="14" fill="rgba(255,255,255,0.6)">→ "Turning on lights"</text>
    <text x="20" y="102" font-family="JetBrains Mono, monospace" font-size="14" fill="#22d3ee">hospital.alert</text>
    <text x="200" y="102" font-family="JetBrains Mono, monospace" font-size="14" fill="rgba(255,255,255,0.6)">→ "Issuing alert"</text>
  </g>
</svg>
