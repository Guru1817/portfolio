<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 640" width="420" height="640" fill="none" role="img" aria-label="Things I've Built">
  <defs>
    <linearGradient id="pcBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1030"/><stop offset="1" stop-color="#0d0718"/>
    </linearGradient>
    <linearGradient id="pcBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5fbf"/><stop offset="0.5" stop-color="#c86bff"/><stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <linearGradient id="pcRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5fbf"/><stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <linearGradient id="pcChip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5fbf" stop-opacity="0.25"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="pcGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="pcClip"><rect x="10" y="10" width="400" height="620" rx="28"/></clipPath>
    <style>
      .m{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace}
      .s{font-family:'Segoe UI',Inter,system-ui,sans-serif}
      .row{opacity:0;animation:sl .55s ease-out forwards}
      @keyframes sl{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:translateX(0)}}
      .liveDot{animation:pulse 1.6s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
    </style>
  </defs>

  <!-- card body -->
  <g filter="url(#pcGlow)"><rect x="10" y="10" width="400" height="620" rx="28" fill="url(#pcBg)" stroke="url(#pcRing)" stroke-width="2"/></g>

  <g clip-path="url(#pcClip)">
    <!-- header bar -->
    <rect x="10" y="10" width="400" height="62" fill="url(#pcBar)" opacity="0.9"/>
    <rect x="10" y="40" width="400" height="32" fill="url(#pcBg)"/>
    <text class="s" x="210" y="48" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">🚀 Things I've Built</text>

    <!-- project rows: outer g = position, inner g = animation -->

    <!-- 1. Vidyapeeth -->
    <g transform="translate(34 100)">
      <g class="row" style="animation-delay:.15s">
        <rect width="352" height="104" rx="16" fill="#ffffff" fill-opacity="0.03" stroke="#ff5fbf" stroke-opacity="0.25"/>
        <rect x="16" y="18" width="44" height="44" rx="12" fill="url(#pcChip)"/>
        <text x="38" y="48" font-size="22" text-anchor="middle">🎓</text>
        <text class="s" x="74" y="34" font-size="16" font-weight="700" fill="#f4e9ff">Vidyapeeth</text>
        <circle class="liveDot" cx="322" cy="29" r="4" fill="#3ddc84"/>
        <text class="m" x="332" y="33" font-size="10" fill="#3ddc84" text-anchor="end" transform="translate(-6 0)">LIVE</text>
        <text class="s" x="74" y="55" font-size="11.5" fill="#c9b6ff">Multi-tenant exam SaaS platform</text>
        <text class="m" x="74" y="80" font-size="10.5" fill="#9a86c8">Spring Boot · React · PostgreSQL</text>
      </g>
    </g>

    <!-- 2. Suraag -->
    <g transform="translate(34 216)">
      <g class="row" style="animation-delay:.30s">
        <rect width="352" height="104" rx="16" fill="#ffffff" fill-opacity="0.03" stroke="#c86bff" stroke-opacity="0.25"/>
        <rect x="16" y="18" width="44" height="44" rx="12" fill="url(#pcChip)"/>
        <text x="38" y="48" font-size="22" text-anchor="middle">🎵</text>
        <text class="s" x="74" y="34" font-size="16" font-weight="700" fill="#f4e9ff">Suraag</text>
        <circle class="liveDot" cx="322" cy="29" r="4" fill="#3ddc84"/>
        <text class="m" x="332" y="33" font-size="10" fill="#3ddc84" text-anchor="end" transform="translate(-6 0)">LIVE</text>
        <text class="s" x="74" y="55" font-size="11.5" fill="#c9b6ff">Offline-first music streaming</text>
        <text class="m" x="74" y="80" font-size="10.5" fill="#9a86c8">Kotlin · Spring Boot · AES</text>
      </g>
    </g>

    <!-- 3. CBCT -->
    <g transform="translate(34 332)">
      <g class="row" style="animation-delay:.45s">
        <rect width="352" height="104" rx="16" fill="#ffffff" fill-opacity="0.03" stroke="#7c5cff" stroke-opacity="0.25"/>
        <rect x="16" y="18" width="44" height="44" rx="12" fill="url(#pcChip)"/>
        <text x="38" y="48" font-size="22" text-anchor="middle">🎯</text>
        <text class="s" x="74" y="34" font-size="16" font-weight="700" fill="#f4e9ff">CBCT Allocation</text>
        <text class="m" x="336" y="33" font-size="10" fill="#8f7fb8" text-anchor="end">REPO</text>
        <text class="s" x="74" y="55" font-size="11.5" fill="#c9b6ff">Seat allocation engine</text>
        <text class="m" x="74" y="80" font-size="10.5" fill="#9a86c8">Java · Spring Data JPA · MySQL</text>
      </g>
    </g>

    <!-- 4. Text-to-Speech -->
    <g transform="translate(34 448)">
      <g class="row" style="animation-delay:.60s">
        <rect width="352" height="104" rx="16" fill="#ffffff" fill-opacity="0.03" stroke="#ff5fbf" stroke-opacity="0.25"/>
        <rect x="16" y="18" width="44" height="44" rx="12" fill="url(#pcChip)"/>
        <text x="38" y="48" font-size="22" text-anchor="middle">🔊</text>
        <text class="s" x="74" y="34" font-size="16" font-weight="700" fill="#f4e9ff">Text-to-Speech</text>
        <text class="m" x="336" y="33" font-size="10" fill="#8f7fb8" text-anchor="end">REPO</text>
        <text class="s" x="74" y="55" font-size="11.5" fill="#c9b6ff">Excel → natural voice engine</text>
        <text class="m" x="74" y="80" font-size="10.5" fill="#9a86c8">Java · Google Cloud TTS · Maven</text>
      </g>
    </g>

    <!-- footer quote -->
    <line x1="34" y1="572" x2="386" y2="572" stroke="#7c5cff" stroke-opacity="0.3"/>
    <text class="m" x="210" y="600" font-size="11" fill="#b79bff" text-anchor="middle">Code. Coffee. Repeat. 💗</text>
  </g>
</svg>
