name: Generate Snake Animation

on:
  # run every day at 00:30 UTC
  schedule:
    - cron: "30 0 * * *"
  # run on push to main
  push:
    branches:
      - main
  # allow manual runs from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff5fbf&color_dots=#2b1a33,#7c5cff,#c86bff,#ff5fbf,#ff9fd8

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
