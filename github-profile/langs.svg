<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" width="480" height="240" fill="none" role="img" aria-label="Most used languages">
  <defs>
    <linearGradient id="lCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0b1f"/><stop offset="1" stop-color="#0d0612"/>
    </linearGradient>
    <style>
      .m{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace}
      .lb{opacity:0;animation:fu .5s ease-out forwards}
      @keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    </style>
  </defs>
  <rect width="480" height="240" rx="16" fill="url(#lCard)" stroke="#7c5cff" stroke-opacity="0.3"/>
  <text class="m" x="24" y="38" font-size="16" fill="#ff8fd8" font-weight="700">Most Used Languages</text>
  <line x1="24" y1="50" x2="300" y2="50" stroke="#ff5fbf" stroke-opacity="0.3"/>

  <!-- Java -->
  <g class="lb" style="animation-delay:.15s">
    <text class="m" x="24" y="82" font-size="13" fill="#e9d6ff">Java</text>
    <text class="m" x="456" y="82" font-size="13" fill="#b79bff" text-anchor="end">58%</text>
    <rect x="24" y="90" width="432" height="9" rx="4.5" fill="#fff" fill-opacity="0.08"/>
    <rect x="24" y="90" width="0" height="9" rx="4.5" fill="#f89820"><animate attributeName="width" values="0;250" dur="1.2s" begin="0.3s" fill="freeze"/></rect>
  </g>
  <!-- JavaScript -->
  <g class="lb" style="animation-delay:.3s">
    <text class="m" x="24" y="118" font-size="13" fill="#e9d6ff">JavaScript</text>
    <text class="m" x="456" y="118" font-size="13" fill="#b79bff" text-anchor="end">18%</text>
    <rect x="24" y="126" width="432" height="9" rx="4.5" fill="#fff" fill-opacity="0.08"/>
    <rect x="24" y="126" width="0" height="9" rx="4.5" fill="#f7df1e"><animate attributeName="width" values="0;78" dur="1.2s" begin="0.45s" fill="freeze"/></rect>
  </g>
  <!-- Kotlin -->
  <g class="lb" style="animation-delay:.45s">
    <text class="m" x="24" y="154" font-size="13" fill="#e9d6ff">Kotlin</text>
    <text class="m" x="456" y="154" font-size="13" fill="#b79bff" text-anchor="end">12%</text>
    <rect x="24" y="162" width="432" height="9" rx="4.5" fill="#fff" fill-opacity="0.08"/>
    <rect x="24" y="162" width="0" height="9" rx="4.5" fill="#a97bff"><animate attributeName="width" values="0;52" dur="1.2s" begin="0.6s" fill="freeze"/></rect>
  </g>
  <!-- HTML/CSS -->
  <g class="lb" style="animation-delay:.6s">
    <text class="m" x="24" y="190" font-size="13" fill="#e9d6ff">HTML / CSS</text>
    <text class="m" x="456" y="190" font-size="13" fill="#b79bff" text-anchor="end">8%</text>
    <rect x="24" y="198" width="432" height="9" rx="4.5" fill="#fff" fill-opacity="0.08"/>
    <rect x="24" y="198" width="0" height="9" rx="4.5" fill="#e34f26"><animate attributeName="width" values="0;35" dur="1.2s" begin="0.75s" fill="freeze"/></rect>
  </g>
  <!-- Python -->
  <g class="lb" style="animation-delay:.75s">
    <text class="m" x="24" y="226" font-size="13" fill="#e9d6ff">Python</text>
    <text class="m" x="456" y="226" font-size="13" fill="#b79bff" text-anchor="end">4%</text>
    <rect x="24" y="234" width="432" height="9" rx="4.5" fill="#fff" fill-opacity="0.08"/>
    <rect x="24" y="234" width="0" height="4" rx="2" fill="#3776ab"><animate attributeName="width" values="0;17" dur="1.2s" begin="0.9s" fill="freeze"/></rect>
  </g>
</svg>
